# GitHub Actions: LGL Mod Menu টেমপ্লেট বিল্ড করে APK বানায়
# gradle-wrapper.jar না থাকলেও চলে: Gradle নিজে ইনস্টল করা হয়।
name: Build Mod Menu
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" || true

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: modmenu-apk
          path: |
            **/build/outputs/apk/**/*.apk
